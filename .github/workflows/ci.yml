name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest --cov --cov-branch --cov-report=term-missing
      - run: python scripts/scan_secrets.py
      - run: python scripts/check_docs.py
      - run: python scripts/run_benchmark.py --requests 25 --concurrency 5 --assert-slo
